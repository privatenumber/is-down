# Link approved dependency skills here. Without an explicit directory, pnpm only links into
# skill directories that already exist, and the install fails when none does.
skills:
  dirs:
    - .agents/skills

# Agent skills shipped by direct dev dependencies
permissions:
  clean-pkg-json:
    skills: true
  cleye:
    skills: true
  lintroll:
    skills: true
  manten:
    skills: true

# Native packages whose install scripts prepare platform binaries
allowBuilds:
  esbuild: true
  unrs-resolver: true
