name: Live catalog check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    name: Live catalog check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Live check
        # Sets pipefail, so the step fails when the tests fail rather than when tee does
        shell: bash
        run: pnpm test:live 2>&1 | tee live.log

      - name: Open issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Live catalog check failed"
          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" ]; then
            echo "An open issue already tracks this"
            exit 0
          fi
          {
            echo "The weekly live check found catalog entries that no longer work."
            echo
            echo '```'
            grep -E '✖|Error' live.log | head -100
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > body.md
          gh issue create --title "$title" --body-file body.md
