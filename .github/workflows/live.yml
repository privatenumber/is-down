name: Live catalog check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    name: Live catalog check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Live check
        # Sets pipefail, so the step fails when the tests fail rather than when tee does
        shell: bash
        env:
          # The test runner's color library enables color in GitHub Actions even when piped
          NO_COLOR: 1
        run: pnpm test:live 2>&1 | tee live.log

      # One issue tracks the latest run, so failures that start while it is open are still reported
      - name: Report failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live catalog check failed"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')

          # Without timestamps, so an unchanged set of failures produces the same text
          grep -E '✖|Error' live.log | sed -E 's/^[0-9]{2}:[0-9]{2}:[0-9]{2} //' | head -100 > failures.txt
          {
            echo "The weekly live check found catalog entries that no longer work. This issue shows the latest run."
            echo
            echo '```'
            cat failures.txt
            echo '```'
            echo
            echo "Run: $RUN_URL"
          } > body.md

          if [ -z "$number" ]; then
            gh issue create --title "$title" --body-file body.md
            exit 0
          fi

          previous=$(gh issue view "$number" --json body --jq .body)
          gh issue edit "$number" --body-file body.md
          if [[ "$previous" != *"$(cat failures.txt)"* ]]; then
            gh issue comment "$number" --body "The failures changed. Run: $RUN_URL"
          fi

      - name: Close issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --search 'in:title "Live catalog check failed"' --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "The live check passed. Run: $RUN_URL"
          fi
